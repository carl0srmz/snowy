[package]
name = "swfx"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Converter and developer tools: turns the original Flash data into native assets"

[dependencies]
swf = "0.2"
snow_fmt = { path = "../../crates/fmt" }
lyon = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = "1"
rayon = "1"
anyhow = "1"
regex = "1"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }
ttf-parser = "0.25"

[package]
name = "snowdrift"
version = "0.1.0"
edition = "2021"
description = "Mission in Snowdriftland - native port"

[dependencies]
snow_fmt = { path = "../crates/fmt" }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rayon = "1"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
roxmltree = "0.20"
wgpu = "30.0.2"
sdl2 = { version = "0.39.0", features = ["raw-window-handle"] }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "wav", "pcm"] }
ffmpeg-next = "9.1.0"
raw-window-handle = "0.6"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
